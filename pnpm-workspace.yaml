minimumReleaseAge: 10080 # 7 days, supply-chain guard
onlyBuiltDependencies:
  - esbuild
  - '@biomejs/biome'
  - '@tailwindcss/oxide'
# pinned versions newer than the 7-day cutoff — reviewed, kept pinned
minimumReleaseAgeExclude:
  - '@agentclientprotocol/sdk'
  - '@types/node'
  - '@vitest/mocker'
  - '@vitest/spy'
  - dompurify
  - lucide-react
  - marked
  - vite
  - vitest
  - ws
allowBuilds:
  onnxruntime-node: false # browser-only inference; no native runtime download
  protobufjs: false
  sharp: false # dictation uses PCM, not native image processing
  esbuild: true
  '@biomejs/biome': true
  '@tailwindcss/oxide': true
